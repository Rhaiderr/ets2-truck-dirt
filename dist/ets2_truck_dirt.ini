; ETS2 & ATS Truck Dirt - settings for players
;
; Put this file next to ets2_truck_dirt.dll, in <game folder>\bin\win_x64\plugins. When it is missing
; there, the plugin uses (and creates) Documents\<game>\TruckDirt\ets2_truck_dirt.ini instead.
; ETS2 and ATS each have their own plugins folder, so each game has its own copy of this file.
;
; Comments start with ";" at the beginning of a line (not after a value). Changes take effect the next
; time the game starts. A key that is missing takes the default shown here.
;
; Keys under "if present" belong to features that may not be in your build yet: a build that does not
; know a key ignores it. They are commented out; remove the ";" to change one.

[probe]
; Must stay 1: the plugin learns your truck's and trailers' wheel layout from the game's telemetry.
; It also writes TruckDirt\telemetry.csv (roughly 0.6 MB per hour of play) and configs.log.
telemetry = 1
; Must stay 1: the dirt is drawn by the GPU part. 0 = the plugin does nothing visible.
; The GPU part turns itself off in multiplayer (TruckersMP, Convoy).
gpu = 1
; What is drawn on your rig:
;   2 = dirt (normal play)
;   0 = nothing (the dirt is still simulated and saved)
;   1 = paint the rig red, 3 = colours by position, 4 = diagnosis colours (tests only)
tint = 2
; Seconds between the shader census lines in gpu_probe.log (minimum 10). 600 = quiet.
census_s = 600
; 1 = also log rain and glass-drop diagnostics every second (developers only).
verbose = 0
sample_ms = 1000
; Frame captures for the developers (0 = off). Each capture is a large text file in TruckDirt\captures.
capture_s = 0
captures = 20

[dust]
; How fast the rig gets dirty: 1.0 = normal, 2.0 = twice as fast, 0.5 = half.
rate = 1.0
; Test only: forces the dirt level of truck and trailers, 0.0 to 1.0. -1 = the real, simulated level.
; While it is forced nothing is saved.
level = -1
; The cab's inside seen through the windows (seats, dashboard, bunk) gets no dust: a box around the driver's seat,
; half its width, then how far it goes below, above, ahead of and behind the driver's eye (metres). 0 = off.
cab_inside = 0.95 1.05 0.35 0.85 0.45
; The whole cab (the sleeper too), the same way: a larger box reaching the cab's shell, where only the faces turned
; towards its middle (the inside's walls, ceiling, bunks) get no dust; the shell's outer faces keep theirs.
cab_cavity = 1.15 1.0 1.5 0.85 2.6
; 1 = the dirt has relief in the game's light (the mud's clumps, grains and drops of oil seen up close); 0 = flat.
relief = 1

[glass]
; N40 (being tested): 1 = the truck's glass takes the truck's dirt, 0 = clean glass,
;   2 = paint the glass the dirt reaches magenta, 3 = paint each pixel where the shader places it,
;   4 = paint the arc the wipers sweep, 5 = paint the dirt it worked out (red how much,
;   green what the blades took) (tests only)
on = 0
; how strong the dirt on the glass is (0.5 = half, 2 = twice)
strength = 1.0
; N64k: how bright a surface of that dirt is, in the scene's own units. The game's forward target
;   holds radiance before the tone map, where a sunlit surface is worth tens, so a reflectance of
;   0..1 written there comes out nearly black. Higher = the pane obstructs more; it is also the
;   'glass light' row of the test panel.
brightness = 10
; N64 (being tested): the arc the wipers clear on the windshield. With the wipers on, the dust inside it goes
; (the film and the soot stay: a dry blade smears those). Four numbers: how far the two pivots sit from the
; pane's middle and how high, as shares of the windshield the plugin measures; the blade's length as a share of
; the pane's height; half the sweep in degrees. 0 = the wipers clear nothing.
wiper = 0.45 0.02 0.48 42
; N65 (being tested): the key for the washer jet. Inside that same arc it takes everything -- the film and the
; soot too, which the blades alone never touch -- so the swept part comes out as clean glass while the rest of
; the pane stays dirty until you wash the truck. Empty = off.
washer_key = f9

[compat]
; Self-check of the game's rendering (after a game update or with a graphics mod). When something the
; drawing relies on changes, 1 = turn that part of the drawing off (safe), 0 = only write it to the log.
enforce = 1

[wash]
; Wash at the service station: at a pump the key and the price show; stop, pull the parking brake and press
; the key to wash. A station where you refuelled is also remembered (it keeps working if a game update hides the
; pump from the plugin).
; Prices are in the game's base currency (euro in ETS2, US dollar in ATS), whole units.
enabled = 1
; Not f8: the game leaves only f8 and f10 free, so other popular plugins tend to take them.
key = ctrl+f7
price_truck = 120
price_trailer = 180
; 1 = the price is charged from your in-game bank account, 0 = free
charge = 1
; 1 = the game's own refuel offer at the pump marks the station; 0 = only the stations where you refuelled.
game_station = 1
; Where the prompt's bottom edge sits, 0.2 (high) to 0.98 (the bottom): above other plugins' prompt lines.
hint_y = 0.82
; Developers only: 1 = log the map's trigger actions to configs.log.
trigger_log = 0

[lang]
; The texts' language: auto = the game's, or a code such as pt_br, en_gb, de_de.
code = auto

[menu]
; The keys menu (wash key, test panel key).
key = shift+f7
; 1 = while the menu or the test panel is open, their keys do not reach the game.
block_input = 1

[test]
; Developers only: 1 = a test panel that forces any dirt layer to any level (nothing is saved from it).
panel = 0
; The key that opens the panel: ctrl+f5, ctrl+shift+p, alt+home... Not ctrl+f9: that is the game's teleport.
panel_key = ctrl+f5
